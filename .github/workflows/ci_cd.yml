name: Flutter CI/CD

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      build_ios:
        description: "Build iOS app (no codesign)"
        type: boolean
        default: true
      create_release:
        description: "Create GitHub Release (tag pushes always create a release)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare .env asset
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 7
          if-no-files-found: ignore

  build-android:
    name: Build Android
    needs: analyze-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle packages
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare .env asset
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" > .env
          elif [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Configure Firebase Android (if secret provided)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: |
          BUILD_ARGS="--release --build-number=${{ github.run_number }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            VERSION="${VERSION%%+*}"
            BUILD_ARGS="$BUILD_ARGS --build-name=$VERSION"
          fi
          flutter build apk $BUILD_ARGS

      - name: Build Android App Bundle (Release)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true }}
        run: |
          BUILD_ARGS="--release --build-number=${{ github.run_number }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            VERSION="${VERSION%%+*}"
            BUILD_ARGS="$BUILD_ARGS --build-name=$VERSION"
          fi
          flutter build appbundle $BUILD_ARGS

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore
          retention-days: 14

  build-ios:
    name: Build iOS (No Codesign)
    needs: analyze-and-test
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_ios == true }}
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare .env asset
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" > .env
          elif [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Configure Firebase iOS (if secret provided)
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS app (no codesign)
        run: |
          BUILD_ARGS="--release --no-codesign --build-number=${{ github.run_number }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            VERSION="${VERSION%%+*}"
            BUILD_ARGS="$BUILD_ARGS --build-name=$VERSION"
          fi
          flutter build ios $BUILD_ARGS

      - name: Package unsigned IPA (Release)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true }}
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r ai_chatbot-ios-unsigned.ipa Payload

      - name: Upload iOS release artifact
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/ipa/ai_chatbot-ios-unsigned.ipa
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-ios]
    if: ${{ !failure() && !cancelled() && (startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-build"
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            release-artifacts/*.apk
            release-artifacts/*.aab
            release-artifacts/*.ipa

